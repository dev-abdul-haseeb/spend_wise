name: Build Releases (APK, Windows, Web)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v0.0.0'
      release_description:
        description: 'Release description / notes'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. ANDROID APK BUILD
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Android APK (Release)
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spend-wise-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. WEB BUILD
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Web (Release)
        run: flutter build web --release

      - name: Archive Web Release
        shell: bash
        run: |
          cd build/web
          zip -r ../../spend-wise-web-release.zip .

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spend-wise-web-release
          path: spend-wise-web-release.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. WINDOWS DESKTOP BUILD
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: dart run flutter_launcher_icons

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Archive Windows Release
        shell: pwsh
        run: |
          if (Test-Path "build\windows\x64\runner\Release") {
            Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "spend-wise-windows-release.zip" -Force
          } elseif (Test-Path "build\windows\runner\Release") {
            Compress-Archive -Path "build\windows\runner\Release\*" -DestinationPath "spend-wise-windows-release.zip" -Force
          } else {
            Get-ChildItem -Path "build\windows" -Recurse
            throw "Windows Release output directory not found!"
          }

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spend-wise-windows-release
          path: spend-wise-windows-release.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. CREATE GITHUB RELEASE (only when manually triggered)
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-web, build-windows]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display Downloaded Files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          body: ${{ github.event.inputs.release_description }}
          files: |
            artifacts/spend-wise-android-apk/app-release.apk
            artifacts/spend-wise-web-release/spend-wise-web-release.zip
            artifacts/spend-wise-windows-release/spend-wise-windows-release.zip